<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cetak QR Code Stand Meja — BURJONUK UNISSULA</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- QRCode.js Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800">

  <!-- Controls Panel (Disembunyikan saat cetak) -->
  <div class="max-w-4xl mx-auto px-4 py-6 print:hidden">
    <div class="bg-white rounded-3xl p-5 border border-slate-200 shadow-sm flex flex-wrap items-center justify-between gap-4">
      
      <div class="flex flex-wrap items-center gap-3">
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">Pilih Nomor Meja:</label>
          <select id="select-table" onchange="generateQRCard()" class="bg-slate-50 border border-slate-200 text-slate-900 text-xs font-black rounded-xl px-3 py-2 outline-none focus:border-emerald-600">
            <option value="01">Meja 01</option>
            <option value="02">Meja 02</option>
            <option value="03">Meja 03</option>
            <option value="04" selected>Meja 04</option>
            <option value="05">Meja 05</option>
            <option value="06">Meja 06</option>
            <option value="07">Meja 07</option>
            <option value="08">Meja 08</option>
            <option value="09">Meja 09</option>
            <option value="10">Meja 10</option>
          </select>
        </div>
      </div>

      <div class="flex items-center gap-2">
        <button onclick="testLink()" class="bg-emerald-50 hover:bg-emerald-100 text-emerald-800 border border-emerald-200 text-xs font-extrabold px-4 py-2 rounded-xl transition flex items-center gap-1.5">
          <i data-lucide="external-link" class="w-4 h-4"></i>
          <span>Uji Coba Link</span>
        </button>
        <button onclick="window.print()" class="bg-emerald-800 hover:bg-emerald-900 text-white px-4 py-2 rounded-xl text-xs font-black transition flex items-center gap-1.5 shadow-sm">
          <i data-lucide="printer" class="w-4 h-4"></i>
          <span>Cetak / Print</span>
        </button>
      </div>

    </div>
  </div>

  <!-- Area Desain Stand Akrilik (Siap Cetak ala QRIS) -->
  <div class="max-w-sm mx-auto px-4 pb-16">
    <div class="bg-white rounded-3xl p-6 border-2 border-emerald-800 shadow-2xl text-center relative overflow-hidden">
      
      <!-- Header / Brand -->
      <div class="mb-4">
        <div class="flex items-center justify-center gap-2 mb-1">
          <div class="w-7 h-7 rounded-lg bg-emerald-800 flex items-center justify-center text-white">
            <i data-lucide="utensils" class="w-3.5 h-3.5"></i>
          </div>
          <h2 class="font-black text-xl text-slate-900 tracking-tight leading-none">BURJONUK</h2>
        </div>
        <p class="text-[11px] text-emerald-800 font-extrabold uppercase tracking-wider">BURJONUK · UNISSULA</p>
      </div>

      <!-- Kotak QR Utama -->
      <div class="bg-emerald-50/50 border-2 border-dashed border-emerald-300 rounded-2xl p-4 w-52 h-52 mx-auto flex flex-col items-center justify-center shadow-inner my-3">
        <div id="qrcode-box" class="flex justify-center items-center"></div>
      </div>

      <!-- Badge Nomor Meja -->
      <div class="my-3 inline-block bg-emerald-800 text-white px-6 py-1.5 rounded-xl shadow-sm">
        <span class="text-[10px] font-bold tracking-wider block uppercase opacity-80">NOMOR MEJA</span>
        <span id="badge-title" class="text-xl font-black tracking-widest">04</span>
      </div>

      <!-- Petunjuk Scan -->
      <div class="mt-2 text-slate-600 text-[11px] font-medium leading-relaxed px-2">
        Scan QR Code di atas menggunakan kamera HP untuk melihat menu, memilih pesanan, dan langsung kirim ke dapur tanpa antre!
      </div>

      <!-- Footer Minimalis -->
      <div class="mt-4 pt-3 border-t border-slate-100 flex items-center justify-between text-[10px] text-slate-400 font-semibold">
        <span>Digital Menu UMKM</span>
        <span class="text-emerald-800 font-bold">Buka 24 Jam</span>
      </div>

    </div>
  </div>

  <script>
    let currentURL = '';

    document.addEventListener('DOMContentLoaded', () => {
      generateQRCard();
    });

    function generateQRCard() {
      const baseUrl = window.location.href.substring(0, window.location.href.lastIndexOf('/')) + '/index.php';
      const tableNum = document.getElementById('select-table').value;
      
      currentURL = `${baseUrl}?mode=dine_in&meja=${tableNum}`;
      document.getElementById('badge-title').innerText = tableNum;

      const qrContainer = document.getElementById('qrcode-box');
      qrContainer.innerHTML = '';

      new QRCode(qrContainer, {
        text: currentURL,
        width: 160,
        height: 160,
        colorDark: '#022c22', // emerald-950
        colorLight: '#ffffff',
        correctLevel: QRCode.CorrectLevel.H
      });

      lucide.createIcons();
    }

    function testLink() {
      window.open(currentURL, '_blank');
    }
  </script>
</body>
</html>
